name: tienda

x-wp-environment: &wp-environment
  WORDPRESS_DB_HOST: db:3306
  WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
  WORDPRESS_DB_USER: ${DB_USER:-wordpress}
  WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?Run scripts/setup.sh first}
  WORDPRESS_DEBUG: '1'
  WORDPRESS_CONFIG_EXTRA: |
    define('WP_ENVIRONMENT_TYPE', 'local');
    define('WP_MEMORY_LIMIT', '256M');
    define('WP_DEBUG_DISPLAY', false);
    define('DISALLOW_FILE_EDIT', true);

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-wordpress}
      MARIADB_USER: ${DB_USER:-wordpress}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Run scripts/setup.sh first}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Run scripts/setup.sh first}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    ports:
      - '127.0.0.1:${WP_PORT:-8080}:80'
    environment: *wp-environment
    volumes:
      - wordpress_data:/var/www/html
      - ./wp-content/themes/gamilea:/var/www/html/wp-content/themes/gamilea:ro
      - ./wp-content/plugins/advanced-custom-fields-pro:/var/www/html/wp-content/plugins/advanced-custom-fields-pro:ro
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, php, -r, "exit(@file_get_contents('http://127.0.0.1/wp-login.php') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 30

  cli:
    image: wordpress:cli-php8.3
    user: '33:33'
    profiles: [tools]
    environment:
      <<: *wp-environment
      WP_URL: ${WP_URL:-http://localhost:8080}
      WP_TITLE: ${WP_TITLE:-GA·MI·LEA}
      WP_ADMIN_USER: ${WP_ADMIN_USER:-tienda_admin}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:?Run scripts/setup.sh first}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:-admin@example.test}
      WC_VERSION: ${WC_VERSION:-latest}
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    volumes:
      - wordpress_data:/var/www/html
      - ./wp-content/themes/gamilea:/var/www/html/wp-content/themes/gamilea:ro
      - ./wp-content/plugins/advanced-custom-fields-pro:/var/www/html/wp-content/plugins/advanced-custom-fields-pro:ro
      - ./scripts/install.sh:/usr/local/bin/install-shop:ro
    depends_on:
      wordpress:
        condition: service_healthy

volumes:
  db_data:
  wordpress_data:
